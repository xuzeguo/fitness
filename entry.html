<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>训练数据录入 - 健身数据</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      padding: 20px;
      line-height: 1.6;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 24px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 500;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #2563eb;
    }

    .exercise-item {
      background: #f9fafb;
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 15px;
    }

    .exercise-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .exercise-name {
      font-weight: 600;
      color: #333;
    }

    .last-value {
      font-size: 12px;
      color: #666;
    }

    .exercise-input {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
    }

    .input-group label {
      font-size: 12px;
      margin-bottom: 4px;
      color: #666;
    }

    .input-group input {
      padding: 8px;
    }

    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: #2563eb;
      color: white;
    }

    .btn-primary:hover {
      background: #1d4ed8;
    }

    .btn-secondary {
      background: #6b7280;
      color: white;
    }

    .btn-secondary:hover {
      background: #4b5563;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 30px;
    }

    .alert {
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 20px;
    }

    .alert-success {
      background: #d1fae5;
      color: #065f46;
      border: 1px solid #6ee7b7;
    }

    .alert-error {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fca5a5;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 768px) {
      .container {
        padding: 20px;
      }

      .exercise-input {
        grid-template-columns: 1fr;
      }

      .btn-group {
        flex-direction: column;
      }

      .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>训练数据录入</h1>
    <p class="subtitle">快速录入今天的训练数据，自动生成 CSV 并更新数据</p>

    <div id="alert" class="alert hidden"></div>

    <form id="trainingForm">
      <div class="form-group">
        <label for="date">日期 *</label>
        <input type="text" id="date" name="date" placeholder="MM-DD（如 04-29）" required>
      </div>

      <div class="form-group">
        <label for="duration">运动时长</label>
        <input type="text" id="duration" name="duration" placeholder="约 120 分钟">
      </div>

      <div id="exercisesContainer"></div>

      <div class="btn-group">
        <button type="button" class="btn btn-secondary" id="copyLastBtn">复制上次训练</button>
        <button type="button" class="btn btn-secondary" id="clearBtn">清空表单</button>
        <button type="submit" class="btn btn-primary">生成 CSV</button>
      </div>
    </form>
  </div>

  <script type="module" src="./src/entry.js"></script>
</body>
</html>
