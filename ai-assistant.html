<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 训练助手 - 健身数据</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: white;
      padding: 16px 20px;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h1 {
      font-size: 20px;
      color: #333;
    }

    .header .nav {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .header a {
      color: #2563eb;
      text-decoration: none;
      font-size: 14px;
    }

    .header a:hover {
      text-decoration: underline;
    }

    .api-key-banner {
      background: #fef3c7;
      border-bottom: 1px solid #fbbf24;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .api-key-banner.hidden {
      display: none;
    }

    .api-key-input {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .api-key-input input {
      padding: 6px 12px;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      font-size: 14px;
      width: 300px;
    }

    .btn {
      padding: 6px 16px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: #2563eb;
      color: white;
    }

    .btn-primary:hover {
      background: #1d4ed8;
    }

    .btn-secondary {
      background: #6b7280;
      color: white;
    }

    .btn-secondary:hover {
      background: #4b5563;
    }

    .container {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      background: white;
      overflow: hidden;
    }

    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      display: flex;
      gap: 12px;
      max-width: 80%;
    }

    .message.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .message.assistant {
      align-self: flex-start;
    }

    .message-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .message.user .message-avatar {
      background: #2563eb;
      color: white;
    }

    .message.assistant .message-avatar {
      background: #10b981;
      color: white;
    }

    .message-content {
      background: #f3f4f6;
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.6;
    }

    .message.user .message-content {
      background: #2563eb;
      color: white;
    }

    .message.assistant .message-content {
      background: #f3f4f6;
      color: #333;
    }

    .message-content pre {
      background: rgba(0,0,0,0.05);
      padding: 8px;
      border-radius: 4px;
      overflow-x: auto;
      margin: 8px 0;
    }

    .message.user .message-content pre {
      background: rgba(255,255,255,0.2);
    }

    .input-container {
      padding: 16px 20px;
      border-top: 1px solid #e5e7eb;
      display: flex;
      gap: 12px;
    }

    .input-container textarea {
      flex: 1;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
      resize: none;
      font-family: inherit;
    }

    .input-container textarea:focus {
      outline: none;
      border-color: #2563eb;
    }

    .quick-actions {
      padding: 12px 20px;
      border-top: 1px solid #e5e7eb;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .quick-btn {
      padding: 6px 12px;
      background: #f3f4f6;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .quick-btn:hover {
      background: #e5e7eb;
    }

    .loading {
      display: flex;
      gap: 4px;
      padding: 12px;
    }

    .loading span {
      width: 8px;
      height: 8px;
      background: #9ca3af;
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out both;
    }

    .loading span:nth-child(1) {
      animation-delay: -0.32s;
    }

    .loading span:nth-child(2) {
      animation-delay: -0.16s;
    }

    @keyframes bounce {
      0%, 80%, 100% {
        transform: scale(0);
      }
      40% {
        transform: scale(1);
      }
    }

    .welcome {
      text-align: center;
      padding: 40px 20px;
      color: #6b7280;
    }

    .welcome h2 {
      font-size: 24px;
      margin-bottom: 12px;
      color: #333;
    }

    .welcome p {
      font-size: 14px;
      line-height: 1.6;
    }

    @media (max-width: 768px) {
      .message {
        max-width: 90%;
      }

      .api-key-input input {
        width: 200px;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🤖 AI 训练助手</h1>
    <div class="nav">
      <button class="btn btn-secondary" id="reconfigBtn" style="display: none; margin-right: 12px;">⚙️ 重新配置</button>
      <a href="./clear-config.html" style="margin-right: 12px;">🗑️ 清除配置</a>
      <a href="./index.html">← 返回首页</a>
    </div>
  </div>

  <div class="api-key-banner" id="apiKeyBanner">
    <div>
      <strong>需要 Claude API 配置</strong> -
      <span>请配置 API 信息（使用中转站时需要自定义 Base URL 和路径）</span>
    </div>
    <div class="api-key-input">
      <input type="text" id="baseUrlInput" placeholder="Base URL（如 https://api.example.com）" style="width: 240px;">
      <select id="apiPathSelect" style="width: 180px; padding: 6px;">
        <option value="/v1/messages">Claude 官方</option>
        <option value="/v1/chat/completions" selected>OpenAI 兼容（中转站）</option>
        <option value="/v1">旧版中转站</option>
        <option value="custom">自定义路径</option>
      </select>
      <input type="text" id="customPathInput" placeholder="自定义路径" style="width: 120px; display: none;">
      <input type="password" id="apiKeyInput" placeholder="API Key" style="width: 240px;">
      <button class="btn btn-primary" id="saveApiKeyBtn">保存</button>
    </div>
  </div>

  <div class="container">
    <div class="chat-container" id="chatContainer">
      <div class="welcome">
        <h2>👋 你好！我是你的 AI 训练助手</h2>
        <p>我可以帮你：</p>
        <p>📝 快速录入训练数据（自然语言）</p>
        <p>📊 分析训练趋势和进步</p>
        <p>💡 提供个性化训练建议</p>
        <p>❓ 回答健身相关问题</p>
        <br>
        <p>试试下面的快捷操作，或直接输入你的问题！</p>
      </div>
    </div>

    <div class="quick-actions">
      <button class="quick-btn" data-action="record">📝 录入今天的训练</button>
      <button class="quick-btn" data-action="analyze">📊 分析我的训练趋势</button>
      <button class="quick-btn" data-action="suggest">💡 给我一些训练建议</button>
      <button class="quick-btn" data-action="progress">🎯 查看我的进步</button>
    </div>

    <div class="input-container">
      <textarea id="userInput" rows="3" placeholder="输入消息...（例如：今天练了卷腹机 45kg×12×4，卧推 40kg×10×3）"></textarea>
      <button class="btn btn-primary" id="sendBtn">发送</button>
    </div>
  </div>

  <script type="module" src="./src/ai-assistant.js"></script>
</body>
</html>
